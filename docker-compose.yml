# Local stack. Dev-only database credentials; never reuse them elsewhere.
x-python-env: &python-env
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/relocation
  CALLING_ENABLED: "false"
  DEMO_MODE: ${DEMO_MODE:-false}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  SESSION_SECRET: ${SESSION_SECRET:-}
  PHONE_ENCRYPTION_KEY: ${PHONE_ENCRYPTION_KEY:-}
  MAPS_API_KEY: ${MAPS_API_KEY:-}
  GEMINI_TEXT_MODEL: ${GEMINI_TEXT_MODEL:-}
  GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
  GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
  GEMINI_LIVE_MODEL: ${GEMINI_LIVE_MODEL:-}
  GEMINI_LIVE_FALLBACK_MODEL: ${GEMINI_LIVE_FALLBACK_MODEL:-}
  WEB_ORIGINS: ${WEB_ORIGINS:-http://localhost:3000}

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: relocation
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d relocation"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/Dockerfile.python
      args: { APP_DIR: apps/api, MODULE: relocation_api }
    environment:
      <<: *python-env
      RUN_MIGRATIONS: "true"
    ports: ["${API_PORT:-8010}:8000"]
    volumes:
      - agreementdata:/data/agreements
    depends_on:
      db: { condition: service_healthy }

  voice-gateway:
    build:
      context: .
      dockerfile: apps/Dockerfile.python
      args: { APP_DIR: apps/voice-gateway, MODULE: voice_gateway }
    environment: *python-env
    ports: ["${GATEWAY_PORT:-8011}:8000"]
    depends_on:
      db: { condition: service_healthy }

  worker:
    build:
      context: .
      dockerfile: apps/Dockerfile.python
      args: { APP_DIR: apps/worker, MODULE: relocation_worker }
    environment: *python-env
    ports: ["${WORKER_PORT:-8012}:8000"]
    depends_on:
      db: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_URL: http://api:8000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:-ws://localhost:8011}
      DEMO_MODE: ${DEMO_MODE:-false}
    ports: ["3000:3000"]
    depends_on:
      - api

volumes:
  dbdata:
  agreementdata:
